# ==========================================================================
#  OwnForm Nginx 站点配置片段（宝塔面板可用）
#  作用：禁止 Web 直接访问项目敏感目录（.htaccess 仅 Apache 生效，
#        Nginx 必须显式配置 deny，这是部署到公网的必要步骤）
# ==========================================================================
#
#  【宝塔面板操作步骤】
#  1. 站点设置 → 网站目录 → 运行目录选择 /public，保存
#  2. 站点设置 → 伪静态 → 选择 thinkphp 模板，保存
#     （该模板已自带 ThinkPHP 所需的 location / 重写，
#       因此本文件不含 location /，粘贴后不会与伪静态重复冲突）
#  3. 站点设置 → 配置文件 → 将下面的 location 段粘贴到 server { } 内
#     （默认放行 /install 安装向导；安装完成后再按第 4 段注释说明关闭入口）
#  4. 站点设置 → 配置文件 → 确认已配置 HTTPS（宝塔申请证书后会自动添加 443 块）
#  5. 重载 Nginx
#
#  【Apache 用户】
#  项目内各敏感目录已内置 .htaccess（deny from all），无需额外配置。
#  但仍须把运行目录指向 /public。
#
# --------------------------------------------------------------------------

# 1) 禁止访问敏感目录（务必放在 rewrite 规则之前）
location ~* ^/(app|config|install|runtime|vendor|route|extend|view|updates|version|admin-src)/ {
    deny all;
    return 404;
}

# 2) 禁止访问隐藏文件（.git / .env / .htaccess 等）
location ~ /\.(?!well-known/) {
    deny all;
    return 404;
}

# 3) 禁止访问常见敏感文件
location ~* ^/(composer\.(json|lock)|\.env.*|.*\.sql|.*\.log|.*\.bak)$ {
    deny all;
    return 404;
}

# 4) 安装器入口：安装向导需要先放行 /install，安装完成并删除 install/ 目录后，
#    取消下面三行注释并重载 Nginx（双重保险，防止重装接管）
# location = /install {
#     return 404;
# }

# --------------------------------------------------------------------------
# 5) PATH_INFO 重写：宝塔「伪静态 thinkphp 模板」已包含等价规则，
#    此处不再重复提供，避免粘贴后报 duplicate location "/"。
#    手动部署（无宝塔伪静态）时在 server{} 内自行加入：
#
#    location / {
#        if (!-e $request_filename) {
#            rewrite ^(.*)$ /index.php/$1 last;
#        }
#    }
# --------------------------------------------------------------------------

# 5.5) HTML 文档与管理后台入口禁止缓存：版本升级覆盖文件后浏览器立即生效
#      （/admin/static/ 下的 js/css 带内容哈希文件名，可长期缓存）
location = /admin {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /admin/index.html =404;
}
location = /admin/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /admin/index.html =404;
}
location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# --------------------------------------------------------------------------
# 6) 上传目录：禁止执行任何脚本（防止上传文件被当作 PHP 执行）
# --------------------------------------------------------------------------
location ~* ^/storage/uploads/.*\.(php|phtml|php3|php4|php5|php7|phps|pht)$ {
    deny all;
    return 404;
}